# Render Blueprint — deploys the Zeroplus backend (free tier, no card).
# In Render: New + → Blueprint → connect this repo → it reads this file.
# Then fill the `sync: false` env vars in the dashboard (values Render won't
# store in git). See backend/README.md for what each does.
services:
  - type: web
    name: zeroplus-backend
    runtime: node
    rootDir: backend
    plan: free
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render injects PORT automatically; the app reads it (config.port).
      - key: OTP_PROVIDER
        value: console # codes print to the Render logs until WhatsApp keys are added
      - key: EMAIL_FROM
        value: Zeroplus <onboarding@resend.dev>
      # --- Secrets: set these in the Render dashboard (sync:false = not in git) ---
      - key: DATABASE_URL
        sync: false # Neon zeroplus-dev POOLED connection string
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # http://localhost:3000 for now; the frontend's deployed URL later
      - key: BACKEND_PUBLIC_URL
        sync: false # this service's own https URL, set after the first deploy
      # Provider keys — leave unset to keep mock modes; add when you have them:
      # GOOGLE_CLIENT_ID, CLOUDINARY_*, RESEND_API_KEY, WHATSAPP_*, PHONEPE_*
